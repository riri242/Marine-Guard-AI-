name: Model integration smoke test

on:
  push:
    branches:
      - main
      - docs/reproducibility-and-notebook-cleanup
    paths:
      - "models/best.pt"
      - "app/**"
      - "scripts/smoke_test_app.py"
      - "requirements.txt"
      - ".github/workflows/model-smoke.yml"
  pull_request:
    paths:
      - "models/best.pt"
      - "app/**"
      - "scripts/smoke_test_app.py"
      - "requirements.txt"
      - ".github/workflows/model-smoke.yml"
  workflow_dispatch:

jobs:
  inference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify selected checkpoint file
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("models/best.pt")
          assert p.is_file() and p.stat().st_size == 10641633, "Original best.pt missing or unexpected"
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          assert h == "2719a2bf1e07f922e70c65230871529ad1303b1f706e6f33beb98ad7812a2005", h
          print("Original checkpoint verified:", h)
          PY
      - name: Run shared inference smoke test
        run: python -m scripts.smoke_test_app
      - name: Verify representative underwater image inference
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          from pathlib import Path
          from PIL import Image
          notebook = json.loads(Path("notebooks/model_development/02_model_evaluation.ipynb").read_text(encoding="utf-8"))
          cell = notebook["cells"][6]
          images = [output["data"]["image/png"] for output in cell.get("outputs", [])
                    if "image/png" in output.get("data", {})]
          assert images, "The historical evaluation notebook no longer includes its input image"
          content = images[0]
          if isinstance(content, list):
              content = "".join(content)
          image = Image.open(io.BytesIO(base64.b64decode(content))).convert("RGB")
          assert image.width >= 640 and image.height >= 360
          image.save("/tmp/marineguard_existing_underwater_sample.png")
          print("Extracted representative sample from existing notebook:", image.size)
          PY
          python -m scripts.smoke_test_app \
            --image /tmp/marineguard_existing_underwater_sample.png \
            --output outputs/underwater_smoke_test.png
      - name: Verify Streamlit starts successfully
        shell: bash
        run: |
          python -m streamlit run app/streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: original-yolo26n-inference-smoke
          path: |
            outputs/smoke_test.png
            outputs/underwater_smoke_test.png
          retention-days: 14
