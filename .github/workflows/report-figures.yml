name: Generate report figures

on:
  push:
    branches:
      - docs/reproducibility-and-notebook-cleanup
    paths:
      - "scripts/generate_report_figures.py"
      - "reports/figures/07_threshold_sweep_yolo26n.csv"
      - ".github/workflows/report-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting libraries
        run: python -m pip install numpy matplotlib
      - name: Generate PNG figures
        run: python scripts/generate_report_figures.py
      - name: Commit report figures
        shell: bash
        run: |
          git add reports/figures/*.png
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Render reproducible report figures"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
